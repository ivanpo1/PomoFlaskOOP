{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
<form id="registerForm" method="post">
    <div class="mb-3">
        <input 
            id="username"
            class="form-control mx-auto w-auto" 
            name="username" 
            placeholder="Username" 
            type="text"
        >
    </div>
    <div class="mb-3">
        <input 
            id="password"
            class="form-control mx-auto w-auto" 
            name="password" 
            placeholder="Password" 
            type="password"
        >
    </div>
    <div class="mb-3">
        <input 
            id="confirmation"
            class="form-control mx-auto w-auto" 
            name="confirmation" 
            placeholder="Password (Again)" 
            type="password"
        >
    </div>
    <div id="register-error" class="alert alert-danger" style="display: none;"></div>
    <button class="btn btn-primary" type="submit">Register</button>
</form>
{% endblock %}
